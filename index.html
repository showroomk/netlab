<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow,noarchive">
<title>NetLab 実機トレーナー</title>
<style>
  :root { color-scheme: light; padding-top: env(safe-area-inset-top, 0px); padding-bottom: env(safe-area-inset-bottom, 0px); }
  body { margin: 0; font-size: 14px; font-family: system-ui, sans-serif; }
  img { max-width: 100%; }
  [hidden] { display: none !important; }
</style>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans+JP:wght@400;500;600;700&display=swap">
<link rel="stylesheet" href="app.css">
</head>
<body>

<div id="app">
  <header id="top">
    <div class="brand"><b>NetLab</b><span>Cisco &amp; Cato 実機トレーナー</span></div>
    <input id="labName" type="text" aria-label="ラボ名" value="">
    <div class="menu">
      <button class="hbtn" id="btnFile" aria-haspopup="true">ファイル</button>
      <div class="menu-list" id="fileMenu" hidden></div>
    </div>
    <div class="menu">
      <button class="hbtn" id="btnSample" aria-haspopup="true">サンプル</button>
      <div class="menu-list" id="sampleMenu" hidden></div>
    </div>
    <div class="spacer"></div>
    <div class="seg" role="group" aria-label="時間モード">
      <button id="mRt" aria-pressed="true">リアルタイム</button>
      <button id="mSim" aria-pressed="false">シミュレーション</button>
    </div>
    <button class="hbtn cato" id="btnCma">Cato 管理コンソール</button>
    <button class="hbtn" id="btnGuide" aria-pressed="false">ガイド</button>
  </header>

  <div id="body">
    <section id="stage" aria-label="ワークスペース">
      <div id="tools" role="toolbar" aria-label="ツール">
        <button class="tool" data-tool="select" aria-pressed="true" title="選択・移動（クリックで機器を開く）"><svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.4"><path d="M3 2l9 5-4 1.2L6.5 12z"/></svg><span>選択</span></button>
        <button class="tool" data-tool="cable" title="ケーブルでつなぐ"><svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.4"><path d="M2 12c3 0 3-8 6-8s3 8 6 8"/><circle cx="2" cy="12" r="1.4"/><circle cx="14" cy="12" r="1.4"/></svg><span>ケーブル</span></button>
        <button class="tool" data-tool="note" title="メモを置く"><svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.4"><path d="M3 2h10v9l-3 3H3z"/><path d="M10 14v-3h3"/></svg><span>メモ</span></button>
        <button class="tool" data-tool="delete" title="削除"><svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.4"><path d="M3 4h10M6 4V2.5h4V4M4.5 4l.7 9.5h5.6l.7-9.5"/></svg><span>削除</span></button>
        <button class="tool" data-tool="inspect" title="検査（テーブルを見る）"><svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.4"><circle cx="7" cy="7" r="4.5"/><path d="M10.4 10.4L14 14"/></svg><span>検査</span></button>
        <button class="tool" data-tool="pdu" title="PDU（ping を 1 発送る）"><svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.4"><rect x="2" y="4" width="12" height="8" rx="1"/><path d="M2.5 4.5L8 9l5.5-4.5"/></svg><span>PDU</span></button>
        <div class="tsep"></div>
        <button class="tool" id="zOut" title="縮小"><svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.4"><circle cx="7" cy="7" r="4.5"/><path d="M5 7h4M10.4 10.4L14 14"/></svg></button>
        <button class="tool" id="zFit" title="全体を表示"><svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.4"><path d="M2 6V2h4M10 2h4v4M14 10v4h-4M6 14H2v-4"/></svg><span>全体</span></button>
        <button class="tool" id="zIn" title="拡大"><svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.4"><circle cx="7" cy="7" r="4.5"/><path d="M5 7h4M7 5v4M10.4 10.4L14 14"/></svg></button>
        <div class="tsep"></div>
        <button class="tool" id="btnUndo" title="元に戻す（Ctrl+Z）"><svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.4"><path d="M5 3L2 6l3 3"/><path d="M2 6h7a4 4 0 010 8H6"/></svg><span>元に戻す</span></button>
        <label class="tool" style="cursor:pointer"><input type="checkbox" id="optPorts" checked> <span>ポート名</span></label>
      </div>
      <div id="wsWrap">
        <svg id="ws" role="application" aria-label="ネットワーク図。機器をクリックすると操作画面が開きます">
          <defs>
            <pattern id="grid" width="24" height="24" patternUnits="userSpaceOnUse"><circle cx="1" cy="1" r="1" fill="var(--grid)"/></pattern>
          </defs>
          <rect x="-50000" y="-50000" width="100000" height="100000" fill="var(--ws)"/>
          <g id="vp">
            <rect x="-5000" y="-5000" width="10000" height="10000" fill="url(#grid)"/>
            <g id="gLinks"></g>
            <line id="ghost" class="ghost" style="display:none"/>
            <g id="gNotes"></g>
            <g id="gDevs"></g>
            <g id="gAnim"></g>
          </g>
        </svg>
        <div id="simPanel" hidden>
          <header><h3>シミュレーション</h3><span id="evCount" class="mono" style="font-size:11px;color:var(--muted)"></span><span class="spacer"></span>
            <button class="hbtn" id="btnKa" title="キープアライブ・DHCP・HA 判定を 1 回分実行して記録する">定期処理を 1 回</button></header>
          <div class="simctl">
            <button class="hbtn" id="btnReset">リセット</button>
            <button class="hbtn" id="btnBack">戻る</button>
            <button class="hbtn primary" id="btnPlay">再生</button>
            <button class="hbtn" id="btnStep">次へ</button>
            <label>速度 <input type="range" id="speed" min="150" max="1500" step="50" value="600" aria-label="再生間隔（ミリ秒）" style="direction:rtl;width:90px"></label>
            <label><input type="checkbox" id="autoPlay" checked> 自動再生</label>
            <div class="filters" id="simFilters" style="width:100%">
              <label><input type="checkbox" id="f_ICMP" checked> ICMP</label>
              <label><input type="checkbox" id="f_ARP" checked> ARP</label>
              <label><input type="checkbox" id="f_Cato" checked> Cato</label>
              <label><input type="checkbox" id="f_DHCP" checked> DHCP</label>
              <label><input type="checkbox" id="f_HTTP" checked> HTTP</label>
              <label><input type="checkbox" id="f_Telnet" checked> Telnet/SSH</label>
              <label><input type="checkbox" id="fDrop" checked> 破棄</label>
            </div>
          </div>
          <div class="evlist" id="evScroll">
            <table><thead><tr><th>#</th><th>時間</th><th>送信元</th><th>宛先</th><th>種類</th><th>内容</th></tr></thead><tbody id="evBody"></tbody></table>
          </div>
          <div class="evdetail" id="evDetail"></div>
        </div>
      </div>
      <div id="hint"><span id="hintText"></span><span class="clockchip" id="clock">リアルタイム</span></div>
    </section>
    <aside id="guide" hidden aria-label="ガイド"></aside>
  </div>

  <footer id="dock">
    <div class="dockcol"><h4>機器</h4><div class="pal" id="palette"></div></div>
    <div class="dockcol"><h4>ケーブル</h4><div class="cables" id="cables"></div></div>
    <div class="dockcol pducol"><h4>PDU の結果</h4><div class="pdus"><table><thead><tr><th></th><th>結果</th><th>送信元</th><th>宛先</th><th></th></tr></thead><tbody id="pduBody"></tbody></table></div></div>
  </footer>
</div>
<div id="wins"></div>
<div id="pop" hidden></div>
<div id="toast" aria-live="polite"></div>

<script src="engine.js"></script>
<script src="ios.js"></script>
<script src="scenarios.js"></script>
<script src="devices.js"></script>
<script src="cato.js"></script>
<script src="tutor.js"></script>
<script src="ui.js"></script>
</body>
</html>
